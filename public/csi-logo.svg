<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="csi-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2765e" />
      <stop offset="50%" stop-color="#f49d85" />
      <stop offset="100%" stop-color="#315b8c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Tech Hexagon / Ring -->
  <circle cx="60" cy="60" r="54" stroke="currentColor" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.4"/>
  <circle cx="60" cy="60" r="48" fill="#201915" stroke="#f2765e" stroke-width="2.5"/>
  
  <!-- Circuit Nodes and Connections -->
  <line x1="60" y1="20" x2="60" y2="34" stroke="#f2765e" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="86" x2="60" y2="100" stroke="#f2765e" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="60" x2="34" y2="60" stroke="#f2765e" stroke-width="3" stroke-linecap="round"/>
  <line x1="86" y1="60" x2="100" y2="60" stroke="#f2765e" stroke-width="3" stroke-linecap="round"/>

  <!-- CSI Interconnected Core -->
  <path d="M42 46 C42 40 48 36 60 36 C72 36 78 40 78 46 C78 52 70 54 60 56 C48 58 40 62 40 70 C40 80 50 84 60 84 C72 84 80 78 80 70" stroke="url(#csi-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="42" cy="46" r="3.5" fill="#f2765e"/>
  <circle cx="80" cy="70" r="3.5" fill="#f49d85"/>
  <circle cx="60" cy="60" r="5" fill="#f7f4ed"/>
</svg>
